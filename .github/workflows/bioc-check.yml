name: Bioconductor Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  bioccheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: insightsengineering/bioc-check-action@v1.2.1
