name: Bioconductor Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  bioc-check:
    runs-on: ubuntu-latest

    env:
      _R_CHECK_CRAN_INCOMING_: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install BiocManager
        run: |
          Rscript -e 'install.packages("BiocManager", repos="https://cloud.r-project.org")'

      - name: Install Bioconductor & CRAN dependencies
        run: |
          Rscript -e 'BiocManager::install(update = TRUE, ask = FALSE)'
          Rscript -e 'BiocManager::install(dependencies = TRUE, ask = FALSE)'
          Rscript -e 'BiocManager::install(".", dependencies = TRUE, ask = FALSE)'

      - name: Session info
        run: Rscript -e 'sessionInfo()'

      - name: Check package
        run: R CMD check --no-manual --as-cran .

      - name: Show check results if failed
        if: failure()
        run: cat $(find . -name '*.Rcheck/*') || true