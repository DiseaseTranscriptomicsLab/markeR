name: Publish Docker image

# Adjust the branch name below to whichever branch you want to deploy from
# (e.g. "main" once the Shiny app is merged in). Publishing a GitHub Release
# also triggers a build, tagged with that release's version.
on:
  push:
    branches:
      - ShinyApp
  release:
    types: [published]

env:
  dockerhub-package: ${{ secrets.DOCKERHUB_USERNAME }}/marker

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub and GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.dockerhub-package }},ghcr.io/${{ github.repository }}
          # Two independent tagging schemes, kept apart by which event fired:
          #  - every push to ShinyApp -> overwrites the rolling `shiny_dev`
          #    tag (matches the ShinyProxy config, which always tracks the
          #    latest commit).
          #  - publishing a GitHub Release -> a separate, never-overwritten
          #    tag using the release's git tag name as-is (e.g. a release
          #    tagged "shinyv1.1" on GitHub publishes image tag
          #    "shinyv1.1" directly - no extra prefix added here, since the
          #    release tag itself already includes it), PLUS `latest`, so
          #    `latest` always tracks the newest published release (not dev
          #    builds from plain pushes).
          tags: |
            type=raw,value=shiny_dev,enable=${{ github.event_name == 'push' }}
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuse layers from the previous build instead of starting fully
          # fresh every time. GitHub stores this cache separately from the
          # pushed image itself (does not affect image size) and manages
          # its own size cap, evicting old entries automatically - nothing
          # to clean up here. mode=max caches every intermediate layer
          # (not just the final ones), which matters most for the
          # dependency-install layers in the Dockerfile.
          cache-from: type=gha
          cache-to: type=gha,mode=max
